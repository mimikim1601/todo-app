<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 할 일</title>
  <link rel="stylesheet" href="style.css">
  <!-- 새로고침 때 낮 화면이 번쩍이지 않도록 저장된 테마를 먼저 적용 -->
  <script>
    try {
      if (JSON.parse(localStorage.getItem("todo-app:v1")).settings.theme === "night") {
        document.documentElement.dataset.theme = "night";
      }
    } catch (e) {}
  </script>
</head>
<body>
  <!-- 밤하늘 장식 (화면 뒤, 클릭·스크린 리더 대상 아님) -->
  <div class="sky" aria-hidden="true">
    <span class="stars"></span>
    <span class="stars stars-twinkle"></span>
    <span class="stars stars-twinkle stars-twinkle-late"></span>
    <span class="moon"></span>
  </div>

    </svg>
    <!-- 낮 친구들: 토끼 · 다람쥐 (풀숲과 함께 밤에는 사라진다 · 움직임 줄이기 설정이면 멈춘 그림) -->
    <picture class="meadow-friend meadow-friend--bunny">
      <source srcset="images/meadow-bunny.png" media="(prefers-reduced-motion: reduce)">
      <img src="images/meadow-bunny.gif" alt="" width="200" height="200" draggable="false">
    </picture>
    <picture class="meadow-friend meadow-friend--squirrel">
      <source srcset="images/meadow-squirrel.png" media="(prefers-reduced-motion: reduce)">
      <img src="images/meadow-squirrel.gif" alt="" width="180" height="180" draggable="false">
    </picture>
  </div>

  <!-- 밤 친구들: 고양이 · 노란 토끼 (밤에만 보인다) -->
  <div class="night-friends" aria-hidden="true">
    <picture class="meadow-friend meadow-friend--cat">
      <source srcset="images/meadow-cat.png" media="(prefers-reduced-motion: reduce)">
      <img src="images/meadow-cat.gif" alt="" width="170" height="170" draggable="false">
    </picture>
    <picture class="meadow-friend meadow-friend--yellow">
      <source srcset="images/meadow-yellow.png" media="(prefers-reduced-motion: reduce)">
      <img src="images/meadow-yellow.gif" alt="" width="180" height="180" draggable="false">
    </picture>
  </div>

  <main class="app">
    <!-- localStorage를 쓸 수 없을 때만 표시 -->
    <p class="banner" id="storage-banner" role="alert" hidden>이 브라우저에서는 데이터가 저장되지 않습니다</p>

    <!-- 1. 헤더 -->
    <header class="app-header">
      <h1 class="app-title"><span class="title-icon" id="title-icon"></span>오늘의 할 일</h1>
      <time class="today" id="today"></time>
      <button type="button" class="theme-switch" id="theme-switch" role="switch"
              aria-checked="false" aria-label="밤 모드">
        <span class="theme-switch-thumb" aria-hidden="true"></span>
      </button>
    </header>

    <!-- 2. 진행률 -->
    <section class="card progress" aria-labelledby="progress-title">
      <div class="progress-head">
        <h2 class="section-title" id="progress-title">전체 진행률</h2>
        <p class="progress-text" id="progress-text">0 / 0 (0%)</p>
      </div>
      <div class="bar bar-total" role="progressbar" aria-label="전체 진행률"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="bar-fill" id="progress-fill" style="width: 0%"></div>
      </div>

      <ul class="category-progress"></ul>
    </section>

    <!-- 3. 입력 -->
    <section class="card" aria-label="할 일 추가">
      <form class="todo-form" id="todo-form">
        <label for="todo-input" class="visually-hidden">할 일</label>
        <input type="text" id="todo-input" class="todo-input"
               maxlength="100" placeholder="할 일을 입력하세요" autocomplete="off">

        <label for="todo-category" class="visually-hidden">카테고리</label>
        <select id="todo-category" class="todo-select"></select>

        <button type="submit" class="btn btn-primary">추가</button>
      </form>
    </section>

    <!-- 4. 필터 탭 -->
    <nav class="filters" aria-label="카테고리 필터">
      <button type="button" class="filter-btn is-active" data-filter="all" aria-pressed="true">전체</button>
      <!-- 카테고리 탭은 app.js가 이 버튼 앞에 그린다 -->
      <button type="button" class="filter-edit" id="category-open">카테고리 편집</button>
    </nav>

    <!-- 5. 할 일 목록 (app.js에서 렌더링) -->
    <section aria-label="할 일 목록">
      <ul class="todo-list" id="todo-list"></ul>
    </section>
    <button type="button" class="shortcut-hint" id="help-open"><kbd>?</kbd> 단축키 보기</button>

  </main>

  <!-- 단축키 도움말 (? 키 또는 아래 안내 버튼으로 열기) -->
  <dialog class="help-dialog" id="help-dialog" aria-labelledby="help-title">
    <div class="help-head">
      <h2 class="help-title" id="help-title">키보드 단축키</h2>
      <button type="button" class="btn btn-ghost" id="help-close">닫기</button>
    </div>
    <table class="shortcut-table">
      <thead>
        <tr>
          <th scope="col">키</th>
          <th scope="col">동작</th>
        </tr>
      </thead>
      <tbody id="shortcut-rows"></tbody>
    </table>
  </dialog>

  <!-- 카테고리 편집 (추가·이름 바꾸기·삭제, 최대 5개) -->
  <dialog class="help-dialog category-dialog" id="category-dialog" aria-labelledby="category-title">
    <div class="help-head">
      <h2 class="help-title" id="category-title">카테고리 편집</h2>
      <button type="button" class="btn btn-ghost" id="category-close">닫기</button>
    </div>
    <p class="category-note" id="category-note"></p>
    <ul class="category-list" id="category-list"></ul>
    <form class="category-add" id="category-add-form">
      <label for="category-add-input" class="visually-hidden">새 카테고리 이름</label>
      <input type="text" id="category-add-input" class="todo-input" maxlength="10"
             placeholder="새 카테고리 이름" autocomplete="off">
      <button type="submit" class="btn btn-primary" id="category-add-button">추가</button>
    </form>
    <p class="category-error" id="category-error" role="alert" hidden></p>
  </dialog>

  <!-- 화면 아래 안내들 -->
  <div class="toast-stack">
    <!-- 삭제 되돌리기 (5초) -->
    <div class="toast toast-undo" id="undo-toast" role="status" aria-live="polite" hidden>
      <span>삭제했습니다 ·</span>
      <button type="button" class="toast-button" id="undo-button">되돌리기 (Ctrl+Z)</button>
    </div>
    <!-- 잠깐 보였다 사라지는 안내 (저장 실패 등) -->
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
